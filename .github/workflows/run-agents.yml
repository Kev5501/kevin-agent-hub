name: Run agents

on:
  schedule:
    # Daily dispatcher. Each agent has its own schedule (defaults.yaml / agent.yaml); the runner
    # only executes the agents that are due. Keep in sync with dispatcher_interval_hours (24).
    - cron: "00 4 * * *"
  workflow_dispatch:
    inputs:
      agent:
        description: "Agent name(s) to run now. Leave blank to run ALL enabled agents."
        required: false
        default: ""
      dry_run:
        description: "Plan only: no LLM calls and no writes (log shows counts only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: run-agents
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Run agents
        env:
          # One line per CREDENTIAL (not per agent). New agents that reuse an existing connection
          # need no change here. A new platform adds one secret + one line below.
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          TRACKER_SHEET_ID: ${{ secrets.TRACKER_SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Passed via env (not inlined into the script) to avoid script injection.
          EVENT: ${{ github.event_name }}
          AGENT: ${{ inputs.agent }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ "$EVENT" = "schedule" ]; then
            ARGS+=(--due)
          elif [ -n "$AGENT" ]; then
            read -ra NAMES <<< "$AGENT"
            ARGS+=(--agent "${NAMES[@]}")
          else
            ARGS+=(--all)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python -m core.runner "${ARGS[@]}"
