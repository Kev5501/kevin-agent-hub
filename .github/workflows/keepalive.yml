# Keeps this repo's scheduled workflows from being auto-disabled by GitHub after 60 days of no activity.
# This runs weekly and, only if the default branch has had no commit for THRESHOLD_DAYS, makes one
# tiny commit (.github/keepalive.txt).
name: Keepalive

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Commit even if recent activity exists (for testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: keepalive

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Commit only if the repo has been quiet
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          THRESHOLD_DAYS=40
          last=$(git log -1 --format=%ct)
          age_days=$(( ($(date +%s) - last) / 86400 ))
          echo "Last commit on the default branch is ${age_days} day(s) old"
          if [ "${FORCE:-}" != "true" ] && [ "$age_days" -lt "$THRESHOLD_DAYS" ]; then
            echo "Recent activity found; nothing to do."
            exit 0
          fi
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "chore: keepalive commit [skip ci]"
          git push
